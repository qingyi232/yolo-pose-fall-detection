<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能安防监控系统 - 摔倒检测与区域闯入预警平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%); min-height: 100vh; }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.04);
            transition: all 0.3s ease;
        }
        .glass-card:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12), 0 4px 12px rgba(0, 0, 0, 0.06);
        }
        .gradient-header {
            background: linear-gradient(135deg, #374151 0%, #1f2937 100%);
        }
        .stat-card {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            border-left: 4px solid;
        }
        .stat-card.danger { border-color: #ef4444; }
        .stat-card.warning { border-color: #f59e0b; }
        .stat-card.info { border-color: #3b82f6; }
        .stat-card.success { border-color: #10b981; }
        .video-frame {
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 12px;
            overflow: hidden;
        }
        .btn-primary {
            background: #4b5563;
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            background: #374151;
        }
        .btn-success {
            background: #059669;
        }
        .btn-success:hover {
            background: #047857;
        }
        .btn-danger {
            background: #dc2626;
        }
        .btn-danger:hover {
            background: #b91c1c;
        }
        .pulse-dot {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1); }
        }
        .fade-in { animation: fadeIn 0.5s ease; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .modal { 
            display: none; position: fixed; top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.5); 
            backdrop-filter: blur(4px);
            z-index: 1000; 
        }
        .modal.active { display: flex; justify-content: center; align-items: center; }
        .section-title {
            position: relative;
            padding-left: 16px;
        }
        .section-title::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 24px;
            background: #6b7280;
            border-radius: 2px;
        }
    </style>
</head>
<body class="text-gray-700">

    <!-- 顶部导航栏 -->
    <nav class="gradient-header px-6 py-4 shadow-lg">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-white/20 rounded-lg flex items-center justify-center">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-semibold text-white">智能安防监控系统</h1>
                    <p class="text-white/70 text-sm">摔倒检测与区域闯入预警平台</p>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <div id="system-status" class="flex items-center space-x-2 px-4 py-2 bg-white/10 rounded-full">
                    <span class="w-2 h-2 bg-gray-300 rounded-full pulse-dot"></span>
                    <span class="text-white/90 text-sm">连接中...</span>
                </div>
                <button id="btn-start" class="btn-success px-4 py-2 text-white text-sm rounded font-medium">
                    启动
                </button>
                <button id="btn-stop" class="btn-danger px-4 py-2 text-white text-sm rounded font-medium">
                    停止
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-8">
        <!-- 统计卡片 -->
        <section class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8 fade-in">
            <div class="stat-card danger glass-card rounded-xl p-5">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-gray-500 text-sm font-medium">今日摔倒检测</p>
                        <p id="stat-falls" class="text-4xl font-bold text-gray-800 mt-2">0</p>
                        <p class="text-gray-400 text-xs mt-1">Fall Detection</p>
                    </div>
                    <div class="w-12 h-12 bg-red-50 rounded-xl flex items-center justify-center">
                        <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                        </svg>
                    </div>
                </div>
            </div>
            <div class="stat-card warning glass-card rounded-xl p-5">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-gray-500 text-sm font-medium">今日区域闯入</p>
                        <p id="stat-intrusions" class="text-4xl font-bold text-gray-800 mt-2">0</p>
                        <p class="text-gray-400 text-xs mt-1">Intrusion Alert</p>
                    </div>
                    <div class="w-12 h-12 bg-amber-50 rounded-xl flex items-center justify-center">
                        <svg class="w-6 h-6 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                        </svg>
                    </div>
                </div>
            </div>
            <div class="stat-card info glass-card rounded-xl p-5">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-gray-500 text-sm font-medium">CPU 使用率</p>
                        <p id="stat-cpu" class="text-4xl font-bold text-gray-800 mt-2">0%</p>
                        <p class="text-gray-400 text-xs mt-1">CPU Usage</p>
                    </div>
                    <div class="w-12 h-12 bg-blue-50 rounded-xl flex items-center justify-center">
                        <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"/>
                        </svg>
                    </div>
                </div>
            </div>
            <div class="stat-card success glass-card rounded-xl p-5">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-gray-500 text-sm font-medium">内存使用率</p>
                        <p id="stat-memory" class="text-4xl font-bold text-gray-800 mt-2">0%</p>
                        <p class="text-gray-400 text-xs mt-1">Memory Usage</p>
                    </div>
                    <div class="w-12 h-12 bg-emerald-50 rounded-xl flex items-center justify-center">
                        <svg class="w-6 h-6 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4"/>
                        </svg>
                    </div>
                </div>
            </div>
        </section>

        <!-- 视频监控区域 -->
        <section class="mb-8 fade-in">
            <h2 class="section-title text-lg font-semibold text-gray-800 mb-5">实时视频监控</h2>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="glass-card rounded-xl overflow-hidden">
                    <div class="bg-gradient-to-r from-gray-50 to-gray-100 px-5 py-3 flex justify-between items-center border-b">
                        <div class="flex items-center space-x-3">
                            <div class="w-3 h-3 bg-green-500 rounded-full pulse-dot"></div>
                            <span class="font-medium text-gray-700">摄像头 1</span>
                        </div>
                        <span id="camera1-status" class="text-xs text-gray-500 bg-gray-200 px-2 py-1 rounded">在线</span>
                    </div>
                    <div class="video-frame m-4">
                        <img id="video-feed-1" src="/api/video/1" class="w-full aspect-video object-cover" alt="Camera 1">
                    </div>
                </div>
                <div class="glass-card rounded-xl overflow-hidden">
                    <div class="bg-gradient-to-r from-gray-50 to-gray-100 px-5 py-3 flex justify-between items-center border-b">
                        <div class="flex items-center space-x-3">
                            <div class="w-3 h-3 bg-gray-400 rounded-full"></div>
                            <span class="font-medium text-gray-700">摄像头 2</span>
                        </div>
                        <span id="camera2-status" class="text-xs text-gray-500 bg-gray-200 px-2 py-1 rounded">离线</span>
                    </div>
                    <div class="video-frame m-4">
                        <img id="video-feed-2" src="/api/video/2" class="w-full aspect-video object-cover" alt="Camera 2">
                    </div>
                </div>
            </div>
        </section>

        <!-- 事件列表和图表 -->
        <section class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8 fade-in">
            <div class="glass-card rounded-xl overflow-hidden">
                <div class="bg-gradient-to-r from-gray-50 to-gray-100 px-5 py-4 border-b">
                    <h2 class="section-title text-lg font-semibold text-gray-800">最近告警事件</h2>
                </div>
                <div id="event-list" class="p-5 space-y-3 max-h-80 overflow-y-auto">
                    <div class="text-center py-8 text-gray-400">
                        <svg class="w-12 h-12 mx-auto mb-3 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                        </svg>
                        <p>暂无告警事件</p>
                    </div>
                </div>
            </div>
            <div class="glass-card rounded-xl overflow-hidden">
                <div class="bg-gradient-to-r from-gray-50 to-gray-100 px-5 py-4 border-b">
                    <h2 class="section-title text-lg font-semibold text-gray-800">事件统计分析</h2>
                </div>
                <div class="p-5">
                    <canvas id="stats-chart" height="200"></canvas>
                </div>
            </div>
        </section>

        <!-- 区域配置 -->
        <section class="glass-card rounded-xl overflow-hidden fade-in">
            <div class="bg-gradient-to-r from-gray-50 to-gray-100 px-5 py-4 border-b flex justify-between items-center">
                <h2 class="section-title text-lg font-semibold text-gray-800">检测区域配置</h2>
                <button id="btn-add-zone" class="btn-primary px-4 py-2 text-white text-sm rounded-lg font-medium">
                    添加区域
                </button>
            </div>
            <div id="zones-list" class="p-5 grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="text-center py-8 text-gray-400 col-span-3">
                    <svg class="w-12 h-12 mx-auto mb-3 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
                    </svg>
                    <p>暂无检测区域</p>
                </div>
            </div>
        </section>
    </main>

    <!-- 添加区域弹窗 -->
    <div id="zone-modal" class="modal">
        <div class="glass-card p-8 rounded-2xl w-[420px] shadow-2xl">
            <h3 class="text-xl font-semibold text-gray-800 mb-6">添加检测区域</h3>
            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-2">区域名称</label>
                    <input type="text" id="zone-name" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition" placeholder="例如：禁止区域A">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-2">区域坐标</label>
                    <input type="text" id="zone-points" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition" placeholder="x1,y1;x2,y2;x3,y3;x4,y4">
                    <p class="text-xs text-gray-400 mt-2">格式：四个顶点坐标，用分号分隔</p>
                </div>
                <div class="flex space-x-3 pt-2">
                    <button id="btn-save-zone" class="flex-1 btn-primary py-3 text-white rounded-xl font-medium">
                        保存区域
                    </button>
                    <button id="btn-cancel-zone" class="flex-1 py-3 bg-gray-100 text-gray-600 rounded-xl font-medium hover:bg-gray-200 transition">
                        取消
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="mt-12 py-6 border-t border-gray-200 bg-white/50">
        <div class="max-w-7xl mx-auto px-6 text-center text-gray-400 text-sm">
            <p>智能安防监控系统 v1.0 | 基于 YOLOv8 深度学习算法</p>
        </div>
    </footer>

    <script>
        const API_BASE = '';
        let socket = null;
        let statsChart = null;

        document.addEventListener('DOMContentLoaded', () => {
            initWebSocket();
            loadAllData();
            setInterval(loadSystemMetrics, 3000);
            setInterval(loadStatistics, 5000);
            setInterval(loadEvents, 5000);
            setupEventListeners();
        });

        function initWebSocket() {
            try {
                socket = io({ transports: ['polling', 'websocket'], reconnection: true });
                socket.on('connect', () => updateConnectionStatus(true));
                socket.on('disconnect', () => updateConnectionStatus(false));
                socket.on('event', (event) => { addEventToList(event); loadStatistics(); });
            } catch (e) { checkApiConnection(); }
        }

        async function checkApiConnection() {
            try {
                const res = await fetch(`${API_BASE}/api/status`, { signal: AbortSignal.timeout(5000) });
                updateConnectionStatus(res.ok);
            } catch (e) { updateConnectionStatus(false); }
        }

        function updateConnectionStatus(connected) {
            const el = document.getElementById('system-status');
            if (connected) {
                el.innerHTML = '<span class="w-2 h-2 bg-green-400 rounded-full pulse-dot"></span><span class="text-white/90 text-sm">系统在线</span>';
            } else {
                el.innerHTML = '<span class="w-2 h-2 bg-red-400 rounded-full"></span><span class="text-white/90 text-sm">连接断开</span>';
            }
        }

        async function loadAllData() {
            await checkApiConnection();
            await Promise.all([loadEvents(), loadStatistics(), loadZones()]);
            setTimeout(loadSystemMetrics, 500);
            initChart();
        }

        async function loadEvents() {
            try {
                const res = await fetch(`${API_BASE}/api/events?limit=20`, { signal: AbortSignal.timeout(5000) });
                if (res.ok) renderEventList(await res.json());
            } catch (e) {}
        }

        async function loadStatistics() {
            try {
                const res = await fetch(`${API_BASE}/api/statistics`, { signal: AbortSignal.timeout(5000) });
                if (res.ok) {
                    const stats = await res.json();
                    document.getElementById('stat-falls').textContent = stats.total_falls || 0;
                    document.getElementById('stat-intrusions').textContent = stats.total_intrusions || 0;
                    updateChart(stats);
                }
            } catch (e) {}
        }

        async function loadSystemMetrics() {
            try {
                const res = await fetch(`${API_BASE}/api/system/metrics`, { signal: AbortSignal.timeout(8000) });
                if (res.ok) {
                    const m = await res.json();
                    if (m.cpu) document.getElementById('stat-cpu').textContent = Math.round(m.cpu.percent) + '%';
                    if (m.memory) document.getElementById('stat-memory').textContent = Math.round(m.memory.percent) + '%';
                }
            } catch (e) {}
        }

        async function loadZones() {
            try {
                const res = await fetch(`${API_BASE}/api/zones`, { signal: AbortSignal.timeout(5000) });
                if (res.ok) renderZonesList(await res.json());
            } catch (e) {}
        }

        function renderEventList(events) {
            const container = document.getElementById('event-list');
            if (!events || events.length === 0) {
                container.innerHTML = '<div class="text-center py-8 text-gray-400"><svg class="w-12 h-12 mx-auto mb-3 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg><p>暂无告警事件</p></div>';
                return;
            }
            container.innerHTML = events.map(e => `
                <div class="flex items-center justify-between p-4 bg-gradient-to-r ${e.type === 'fall' ? 'from-red-50 to-white border-l-4 border-red-400' : 'from-amber-50 to-white border-l-4 border-amber-400'} rounded-lg">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 ${e.type === 'fall' ? 'bg-red-100' : 'bg-amber-100'} rounded-full flex items-center justify-center">
                            <svg class="w-5 h-5 ${e.type === 'fall' ? 'text-red-500' : 'text-amber-500'}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                            </svg>
                        </div>
                        <div>
                            <p class="font-medium ${e.type === 'fall' ? 'text-red-700' : 'text-amber-700'}">${e.type === 'fall' ? '摔倒检测告警' : '区域闯入告警'}</p>
                            <p class="text-sm text-gray-500">摄像头 ${e.camera_id}</p>
                        </div>
                    </div>
                    <span class="text-xs text-gray-400">${new Date(e.timestamp).toLocaleString()}</span>
                </div>
            `).join('');
        }

        function renderZonesList(zones) {
            const container = document.getElementById('zones-list');
            if (!zones || zones.length === 0) {
                container.innerHTML = '<div class="text-center py-8 text-gray-400 col-span-3"><svg class="w-12 h-12 mx-auto mb-3 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg><p>暂无检测区域</p></div>';
                return;
            }
            container.innerHTML = zones.map(z => `
                <div class="p-4 bg-gray-50 border border-gray-200 rounded-lg">
                    <div class="flex justify-between items-start mb-3">
                        <h4 class="font-semibold text-gray-800">${z.name}</h4>
                        <button onclick="deleteZone(${z.id})" class="text-gray-400 hover:text-red-500 transition">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                            </svg>
                        </button>
                    </div>
                    <p class="text-sm text-gray-500">${z.points ? z.points.length : 0} 个顶点坐标</p>
                </div>
            `).join('');
        }

        function initChart() {
            const ctx = document.getElementById('stats-chart').getContext('2d');
            if (statsChart) statsChart.destroy();
            statsChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['今日'],
                    datasets: [
                        { label: '摔倒检测', data: [0], backgroundColor: 'rgba(239, 68, 68, 0.8)', borderRadius: 6 },
                        { label: '区域闯入', data: [0], backgroundColor: 'rgba(245, 158, 11, 0.8)', borderRadius: 6 }
                    ]
                },
                options: { 
                    responsive: true, 
                    plugins: { legend: { position: 'bottom' } },
                    scales: { y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.05)' } }, x: { grid: { display: false } } }
                }
            });
        }

        function updateChart(stats) {
            if (!statsChart) return;
            if (stats.daily && stats.daily.length > 0) {
                statsChart.data.labels = stats.daily.slice(0, 7).map(d => d.date).reverse();
                statsChart.data.datasets[0].data = stats.daily.slice(0, 7).map(d => d.fall_count).reverse();
                statsChart.data.datasets[1].data = stats.daily.slice(0, 7).map(d => d.intrusion_count).reverse();
            } else {
                statsChart.data.labels = ['今日'];
                statsChart.data.datasets[0].data = [stats.total_falls || 0];
                statsChart.data.datasets[1].data = [stats.total_intrusions || 0];
            }
            statsChart.update();
        }

        function addEventToList(event) {
            loadEvents();
        }

        async function deleteZone(zoneId) {
            if (!confirm('确定删除该检测区域？')) return;
            try {
                await fetch(`${API_BASE}/api/zones/${zoneId}`, { method: 'DELETE' });
                loadZones();
            } catch (e) { alert('删除失败'); }
        }

        async function addZone(name, pointsStr) {
            try {
                const points = pointsStr.split(';').map(p => { const [x, y] = p.split(',').map(Number); return [x, y]; });
                const res = await fetch(`${API_BASE}/api/zones`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, points, color: [102, 126, 234] })
                });
                if (res.ok) { loadZones(); return true; }
            } catch (e) {}
            return false;
        }

        function setupEventListeners() {
            document.getElementById('btn-start').addEventListener('click', async () => {
                const res = await fetch(`${API_BASE}/api/start`, { method: 'POST' });
                if (res.ok) alert('监控系统已启动');
            });
            document.getElementById('btn-stop').addEventListener('click', async () => {
                const res = await fetch(`${API_BASE}/api/stop`, { method: 'POST' });
                if (res.ok) alert('监控系统已停止');
            });
            document.getElementById('btn-add-zone').addEventListener('click', () => {
                document.getElementById('zone-modal').classList.add('active');
            });
            document.getElementById('btn-cancel-zone').addEventListener('click', () => {
                document.getElementById('zone-modal').classList.remove('active');
            });
            document.getElementById('btn-save-zone').addEventListener('click', async () => {
                const name = document.getElementById('zone-name').value.trim();
                const points = document.getElementById('zone-points').value.trim();
                if (!name || !points) { alert('请填写完整信息'); return; }
                if (await addZone(name, points)) {
                    document.getElementById('zone-modal').classList.remove('active');
                    document.getElementById('zone-name').value = '';
                    document.getElementById('zone-points').value = '';
                } else { alert('添加失败'); }
            });
        }
    </script>
</body>
</html>
