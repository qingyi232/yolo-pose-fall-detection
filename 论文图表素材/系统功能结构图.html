<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>系统功能结构图</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: "SimSun", serif; 
            background: white; 
            padding: 40px;
            display: flex;
            justify-content: center;
        }
        .container { width: 900px; }
        .title {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            padding: 12px 30px;
            border: 2px solid black;
            display: inline-block;
            margin-bottom: 20px;
        }
        .level1 {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }
        .line-down {
            width: 2px;
            height: 30px;
            background: black;
            margin: 0 auto;
        }
        .line-horizontal {
            height: 2px;
            background: black;
            margin: 0 50px;
        }
        .modules {
            display: flex;
            justify-content: space-between;
            position: relative;
        }
        .modules::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50px;
            right: 50px;
            height: 2px;
            background: black;
        }
        .module {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90px;
        }
        .module-line {
            width: 2px;
            height: 20px;
            background: black;
        }
        .module-box {
            border: 2px solid black;
            padding: 8px 4px;
            text-align: center;
            font-size: 12px;
            width: 85px;
            line-height: 1.4;
        }
        .sub-modules {
            margin-top: 10px;
        }
        .sub-line {
            width: 2px;
            height: 15px;
            background: black;
            margin: 0 auto;
        }
        .sub-box {
            border: 1px solid black;
            padding: 4px 2px;
            text-align: center;
            font-size: 10px;
            margin-top: 5px;
            line-height: 1.3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="level1">
            <div class="title">基于YOLO与YOLO-pose的摔倒检测与区域闯入系统</div>
        </div>
        <div class="line-down"></div>
        <div class="modules">
            <div class="module">
                <div class="module-line"></div>
                <div class="module-box">多目标检测与姿态估计模块</div>
                <div class="sub-modules">
                    <div class="sub-line"></div>
                    <div class="sub-box">YOLOv8检测</div>
                    <div class="sub-box">关键点提取</div>
                    <div class="sub-box">骨架绘制</div>
                </div>
            </div>
            <div class="module">
                <div class="module-line"></div>
                <div class="module-box">视频流处理模块</div>
                <div class="sub-modules">
                    <div class="sub-line"></div>
                    <div class="sub-box">摄像头采集</div>
                    <div class="sub-box">帧解析</div>
                    <div class="sub-box">多线程处理</div>
                </div>
            </div>
            <div class="module">
                <div class="module-line"></div>
                <div class="module-box">配置管理模块</div>
                <div class="sub-modules">
                    <div class="sub-line"></div>
                    <div class="sub-box">YAML配置</div>
                    <div class="sub-box">参数读取</div>
                    <div class="sub-box">动态更新</div>
                </div>
            </div>
            <div class="module">
                <div class="module-line"></div>
                <div class="module-box">摔倒检测模块</div>
                <div class="sub-modules">
                    <div class="sub-line"></div>
                    <div class="sub-box">高宽比检测</div>
                    <div class="sub-box">角度检测</div>
                    <div class="sub-box">融合判断</div>
                </div>
            </div>
            <div class="module">
                <div class="module-line"></div>
                <div class="module-box">区域闯入检测模块</div>
                <div class="sub-modules">
                    <div class="sub-line"></div>
                    <div class="sub-box">区域配置</div>
                    <div class="sub-box">闯入判断</div>
                    <div class="sub-box">区域绘制</div>
                </div>
            </div>
            <div class="module">
                <div class="module-line"></div>
                <div class="module-box">预警管理模块</div>
                <div class="sub-modules">
                    <div class="sub-line"></div>
                    <div class="sub-box">声音预警</div>
                    <div class="sub-box">邮件通知</div>
                    <div class="sub-box">Webhook</div>
                </div>
            </div>
            <div class="module">
                <div class="module-line"></div>
                <div class="module-box">系统监控模块</div>
                <div class="sub-modules">
                    <div class="sub-line"></div>
                    <div class="sub-box">资源监控</div>
                    <div class="sub-box">健康检查</div>
                    <div class="sub-box">阈值告警</div>
                </div>
            </div>
            <div class="module">
                <div class="module-line"></div>
                <div class="module-box">API服务模块</div>
                <div class="sub-modules">
                    <div class="sub-line"></div>
                    <div class="sub-box">REST接口</div>
                    <div class="sub-box">WebSocket</div>
                    <div class="sub-box">视频流</div>
                </div>
            </div>
            <div class="module">
                <div class="module-line"></div>
                <div class="module-box">可视化存储模块</div>
                <div class="sub-modules">
                    <div class="sub-line"></div>
                    <div class="sub-box">SQLite存储</div>
                    <div class="sub-box">Web界面</div>
                    <div class="sub-box">统计图表</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
